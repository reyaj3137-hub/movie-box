    <style>
        body {

        .app-container {

        }

        .video-card {
            background: #18181f;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 20px;

            border: 1px solid #2a2a35;

        .status-msg {

        /* ===== TOP FLOATING AD ===== */

        #topFloatingAd {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(728px, 100vw);
            min-height: 90px;
            background: #fff;
            z-index: 2147483000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            box-shadow: 0 2px 12px rgba(0,0,0,.35);
        }

        #topFloatingAd .top-ad-content {
            width: 100%;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #topFloatingAd .top-ad-close {
            display: none;
            position: absolute;
            right: 5px;
            top: 5px;
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 50%;
            background: rgba(0,0,0,.78);
            color: #fff;
            font-size: 22px;
            line-height: 30px;
            padding: 0;
            cursor: pointer;
            z-index: 2147483001;
        }

        /* ===== TWO SIDE ADS FOR EVERY VIDEO ===== */

        .video-card {
            position: relative;
        }

        .movie-side-ad {
            position: absolute;
            top: 50%;
            width: 50px;
            height: 320px;
            z-index: 50;
            overflow: visible;
            pointer-events: auto;
        }

        .movie-side-ad.left {
            left: -58px;
            transform: translateY(-50%);
        }

        .movie-side-ad.right {
            right: -58px;
            transform: translateY(-50%);
        }

        .movie-side-ad-inner {
            width: 320px;
            height: 50px;
            position: absolute;
            top: 135px;
            left: -135px;
            transform: rotate(90deg);
            transform-origin: center center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .movie-side-ad.right .movie-side-ad-inner {
            transform: rotate(-90deg);
        }

        @media (max-width: 620px) {

            .movie-side-ad {
                width: 42px;
                height: 270px;
            }

            .movie-side-ad.left {
                left: -48px;
            }

            .movie-side-ad.right {
                right: -48px;
            }

                top: 110px;
            }
        }

        @media (max-width: 430px) {

            .movie-side-ad.right {
                right: -42px;
            }

            .movie-side-ad {

            }

<body>

    <!-- ===== TOP FLOATING AD ===== -->

    <div id="topFloatingAd">

        <div class="top-ad-content">

            <script async="async"
                data-cfasync="false"
                src="https://pl31094026.profitableratecpmnetwork.com/2ac039b86eb14a98f23d5820729446aa/invoke.js">
            </script>

            <div id="container-2ac039b86eb14a98f23d5820729446aa"></div>

        </div>

        <button
            class="top-ad-close"
            id="topAdClose"
            aria-label="Close advertisement">
            ×
        </button>

    </div>


    <div class="app-container">

        <div class="app-header">
            MOVIE BOX
        </div>

        <input type="text" id="searchInput" style="display:none;">

        <div id="videoContainer"></div>

    </div>


    <script src="script.js"></script>


    <script>

    /* =========================================================
       শুধু Advertisement-এর জন্য যোগ করা কোড
       ========================================================= */

    (function () {

        /* Top Ad-এর Close Button ৫ সেকেন্ড পরে আসবে */

        var topAd = document.getElementById('topFloatingAd');
        var topClose = document.getElementById('topAdClose');

        setTimeout(function () {

            if (topClose) {
                topClose.style.display = 'block';
            }

        }, 5000);


        /* Close করলে শুধু Top Ad বন্ধ হবে */

        if (topClose) {

            topClose.addEventListener('click', function () {

                if (topAd) {
                    topAd.remove();
                }

            });

        }


        /* প্রত্যেক Video Card-এ দুই পাশের Ad যোগ */

        function addSideAds(card) {

            if (!card || card.dataset.sideAdsAdded === '1') {
                return;
            }

            card.dataset.sideAdsAdded = '1';


            ['left', 'right'].forEach(function (side) {

                var ad = document.createElement('div');

                ad.className = 'movie-side-ad ' + side;


                var inner = document.createElement('div');

                inner.className = 'movie-side-ad-inner';


                inner.innerHTML =
                    '<script>' +
                    'atOptions = {' +
                    '\'key\' : \'1519cc1e96aca6e61289dafed23cfc54\',' +
                    '\'format\' : \'iframe\',' +
                    '\'height\' : 50,' +
                    '\'width\' : 320,' +
                    '\'params\' : {}' +
                    '};' +
                    '<\/script>' +

                    '<script src="https://www.highrevenueformat.com/1519cc1e96aca6e61289dafed23cfc54/invoke.js"><\/script>';


                ad.appendChild(inner);

                card.appendChild(ad);

            });

        }


        /* Video Card খুঁজে বের করা */

        function scanVideoCards() {

            document
                .querySelectorAll('#videoContainer .video-card')
                .forEach(addSideAds);

        }


        /*
         script.js নতুন Video Card তৈরি করলেও
         সেটার মধ্যে automatically দুই পাশের Ad বসবে
        */

        var videoContainer =
            document.getElementById('videoContainer');


        if (videoContainer) {

            var observer =
                new MutationObserver(function () {

                    scanVideoCards();

                });


            observer.observe(videoContainer, {

                childList: true,
                subtree: true

            });

        }


        /* Page load হওয়ার পর existing card-এ Ad বসানো */

        scanVideoCards();

    })();

    </script>

</body>
