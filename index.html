        /* =====================================

        #floatingAd {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(728px, 95vw);
            min-height: 90px;
            background: #ffffff;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.55);
            border-radius: 4px;

        }

        #floatingAdContent {
            width: 100%;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #floatingAdClose {
            display: none;
            position: absolute;
            top: -15px;
            right: -15px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: #222;
            color: #fff;
            font-size: 23px;
            font-weight: bold;
            line-height: 34px;
            text-align: center;
            cursor: pointer;
            z-index: 1000000;
            padding: 0;
        }

        #floatingAdClose:hover {
            background: #000;
        }

        @media (max-width: 600px) {
            #floatingAd {
                width: 95vw;
                min-height: 70px;
            }
            #floatingAdContent {
                min-height: 70px;
            }
            #floatingAdClose {
                top: -12px;

    <!-- =====================================
         FLOATING AD CLOSE SYSTEM (5s Delay)
         ===================================== -->
    <script>
        (function () {
            var floatingAd = document.getElementById("floatingAd");
            var closeButton = document.getElementById("floatingAdClose");

            setTimeout(function () {
                if (closeButton) {
                    closeButton.style.display = "block";
                }
            }, 5000);

            if (closeButton) {
                closeButton.addEventListener("click", function () {
                    if (floatingAd) {
                        floatingAd.remove();
                    }
                });
            }
        })();
    </script>
