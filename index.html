<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Box</title>
    
    <!-- Open Graph SEO Metadata for Facebook -->
    <meta property="og:title" content="Movie Box - Watch Videos">
    <meta property="og:description" content="Watch simple, fast and clean videos on Movie Box.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://via.placeholder.com/1200x630.png?text=MOVIE+BOX">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Floating Advertisement Placeholder -->
    <div id="top-floating-ad" class="floating-ad-wrapper">
        <!-- PASTE_ADSTERRA_FLOATING_AD_CODE_HERE -->
    </div>

    <!-- Header / Logo -->
    <header class="header">
        <h1 class="logo">MOVIE BOX</h1>
    </header>

    <!-- Search System -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search videos..." onkeyup="filterVideos()">
    </div>

    <!-- Video Feed Container -->
    <main id="videoContainer" class="video-container">
        <div class="status-msg">ভিডিও লোড হচ্ছে...</div>
    </main>

    <script src="script.js"></script>
</body>
                                    </html>
