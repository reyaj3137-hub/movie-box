<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Box</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:110px 15px 20px;
  background:#121216;
  color:#fff;
  font-family:Arial,sans-serif;
}
.app-container{max-width:500px;margin:auto}
.app-header{
  text-align:center;font-size:24px;font-weight:700;
  color:#ff3366;margin:0 0 18px;
}
.video-card{
  background:#18181f;border:1px solid #2a2a35;
  border-radius:15px;padding:14px;margin-bottom:15px;
}
.demo-video{
  height:160px;border-radius:10px;
  background:linear-gradient(135deg,#292936,#17171d);
  display:flex;align-items:center;justify-content:center;
  color:#aaa;
}
#topAdWrapper{
  position:fixed;z-index:99999;top:0;left:0;width:100%;
  display:flex;justify-content:center;padding:0;
}
#topAdBox{
  position:relative;width:min(728px,100%);
  min-height:90px;background:#fff;overflow:hidden;
  box-shadow:0 3px 16px rgba(0,0,0,.5);
}
#topAdContent{
  min-height:90px;width:100%;
  display:flex;align-items:center;justify-content:center;
  color:#777;text-align:center;
}
#closeAdBtn{
  display:none;position:absolute;right:6px;top:6px;
  width:30px;height:30px;border:0;border-radius:50%;
  background:rgba(0,0,0,.78);color:#fff;font-size:22px;
  line-height:30px;cursor:pointer;z-index:100000;
}
@media(max-width:600px){
  body{padding-top:85px}
  #topAdBox,#topAdContent{min-height:70px}
}
</style>
</head>
<body>

<div id="topAdWrapper">
  <div id="topAdBox">
    <button id="closeAdBtn" aria-label="বিজ্ঞাপন বন্ধ করুন">×</button>

    <div id="topAdContent">
      <!-- তোমার আসল বিজ্ঞাপন -->
      <script async="async" data-cfasync="false"
        src="https://pl31094026.profitableratecpmnetwork.com/2ac039b86eb14a98f23d5820729446aa/invoke.js"></script>
      <div id="container-2ac039b86eb14a98f23d5820729446aa"></div>
    </div>
  </div>
</div>

<div class="app-container">
  <div class="app-header">MOVIE BOX</div>

  <div id="videoContainer">
    <div class="video-card">
      <div class="demo-video">তোমার ওয়েবসাইটের ভিডিও/কনটেন্ট এখানে থাকবে</div>
    </div>
    <div class="video-card">
      <div class="demo-video">আরও কনটেন্ট</div>
    </div>
  </div>
</div>

<script src="script.js"></script>

<script>
(function(){
  const closeBtn = document.getElementById("closeAdBtn");
  const adWrapper = document.getElementById("topAdWrapper");

  setTimeout(function(){
    closeBtn.style.display = "block";
  }, 5000);

  closeBtn.addEventListener("click", function(){
    adWrapper.remove();
  });
})();
</script>

</body>
</html>
